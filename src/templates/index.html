<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💊 약 복용 관리</title>
<style>
  :root {
    --bg: #f7f3ee;
    --panel: #ffffff;
    --accent: #6f4e37;
    --accent-light: #efe3d8;
    --text: #2b2320;
    --muted: #8a7a6d;
    --user-bubble: #6f4e37;
    --bot-bubble: #efe3d8;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 1080px;
    display: flex;
    height: 100vh;
  }
  @media (max-width: 760px) {
    .app { flex-direction: column; height: auto; min-height: 100vh; }
    .sidebar { max-height: 50vh; }
    .chat { height: 70vh; }
  }

  /* ---- sidebar ---- */
  .sidebar {
    width: 360px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--accent-light);
    overflow-y: auto;
    padding: 16px;
  }
  .sidebar h2 { font-size: 14px; margin: 18px 0 8px; color: var(--accent); }
  .sidebar h2:first-child { margin-top: 0; }
  .sidebar select, .sidebar input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #ddd0c2;
    font-size: 13px;
    margin-bottom: 8px;
    background: white;
  }
  .time-checks { display: flex; gap: 10px; font-size: 13px; margin-bottom: 8px; }
  .time-checks label { display: flex; align-items: center; gap: 4px; }

  .med-card {
    border: 1px solid var(--accent-light);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
    background: #fffdfb;
  }
  .med-card .name { font-weight: 600; display: flex; justify-content: space-between; }
  .med-card .tag {
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-light);
    border-radius: 6px;
    padding: 1px 6px;
  }
  .med-card .row { color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; }
  .med-card .stock-low { color: var(--error); font-weight: 600; }
  .empty-hint { color: var(--muted); font-size: 12px; padding: 4px 2px; }

  #addMedForm button {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 2px;
  }
  #addMedForm button:hover { background: #5c3f2c; }
  #addMedMsg { font-size: 12px; margin-top: 6px; min-height: 14px; }
  #addMedMsg.error { color: var(--error); }
  #addMedMsg.ok { color: #2e7d32; }

  /* ---- chat ---- */
  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 0;
  }
  header {
    padding: 16px 20px;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header button {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { background: rgba(255,255,255,0.28); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { display: flex; flex-direction: column; max-width: 80%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--bot-bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .msg.bot .bubble.error { background: #fbe9e7; color: var(--error); }

  .tools {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    max-width: 100%;
  }
  .tools summary { cursor: pointer; user-select: none; }
  .tool-call {
    font-family: "SF Mono", Consolas, monospace;
    background: #f2ece4;
    border-radius: 8px;
    padding: 6px 8px;
    margin-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .typing { color: var(--muted); font-size: 13px; padding-left: 4px; }

  form#chat-form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--accent-light);
    background: var(--panel);
  }
  #input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ddd0c2;
    font-size: 14px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>질환으로 보기</h2>
      <select id="conditionFilter">
        <option value="">전체 질환</option>
      </select>
      <div id="medList"></div>

      <h2>복용 중인 약 추가</h2>
      <form id="addMedForm">
        <input id="medName" type="text" placeholder="약 이름 (예: 오메가3)" required />
        <select id="medCondition" required>
          <option value="" disabled selected>관련 질환 선택</option>
        </select>
        <div class="time-checks" id="medTimes"></div>
        <input id="medDosePerTime" type="number" min="1" value="1" placeholder="1회 복용량 (정)" required />
        <input id="medInstructions" type="text" placeholder="복용 안내 (예: 식후 30분)" required />
        <input id="medDuration" type="number" min="1" placeholder="처방일수 (며칠치, 예: 30)" required />
        <input id="medPrice" type="number" min="0" placeholder="가격 (정당, 원)" required />
        <input id="medStock" type="number" min="0" value="0" placeholder="현재 보유량 (개)" />
        <button type="submit">약 추가</button>
        <div id="addMedMsg"></div>
      </form>
    </aside>

    <div class="chat">
      <header>
        <h1>💊 약 복용 관리</h1>
        <button id="reset">New chat</button>
      </header>
      <div id="messages"></div>
      <form id="chat-form">
        <input id="input" type="text" placeholder="복용 기록, 재고, 다음 처방일에 대해 물어보세요..." autocomplete="off" />
        <button id="send" type="submit">Send</button>
      </form>
    </div>
  </div>

<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("chat-form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const resetBtn = document.getElementById("reset");

const conditionFilter = document.getElementById("conditionFilter");
const medList = document.getElementById("medList");
const medTimesEl = document.getElementById("medTimes");
const addMedForm = document.getElementById("addMedForm");
const addMedMsg = document.getElementById("addMedMsg");
const medCondition = document.getElementById("medCondition");

function addMessage(role, text, toolCalls, isError = false) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (isError ? " error" : "");
  bubble.textContent = text;
  wrap.appendChild(bubble);

  if (toolCalls && toolCalls.length) {
    const details = document.createElement("details");
    details.className = "tools";
    const summary = document.createElement("summary");
    summary.textContent = `🔧 ${toolCalls.length} tool call${toolCalls.length > 1 ? "s" : ""}`;
    details.appendChild(summary);
    toolCalls.forEach(tc => {
      const line = document.createElement("div");
      line.className = "tool-call";
      line.textContent = `${tc.name}(${tc.arguments}) → ${JSON.stringify(tc.result)}`;
      details.appendChild(line);
    });
    wrap.appendChild(details);
  }

  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function setLoading(isLoading) {
  sendBtn.disabled = isLoading;
  input.disabled = isLoading;
}

async function sendMessage(text) {
  addMessage("user", text);
  setLoading(true);

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "Agent is typing...";
  messagesEl.appendChild(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    typing.remove();
    if (!res.ok) {
      addMessage(
        "bot",
        "죄송해요, 요청을 처리하지 못했어요. 메시지를 다시 한번 확인하고 보내주시겠어요? 🙏",
        null,
        true
      );
    } else {
      addMessage("bot", data.reply || "죄송해요, 지금은 답을 드리지 못했어요. 다시 한번 물어봐 주시겠어요?", data.tool_calls);
    }
  } catch (err) {
    typing.remove();
    addMessage(
      "bot",
      "죄송합니다, 지금 서버와 연결이 원활하지 않네요. 잠시 후 다시 시도해 주시겠어요? 🙇",
      null,
      true
    );
  } finally {
    setLoading(false);
    input.focus();
    loadMedications(); // tool calls may have changed stock/medications — refresh the panel
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendMessage(text);
});

resetBtn.addEventListener("click", async () => {
  await fetch("/api/reset", { method: "POST" });
  messagesEl.innerHTML = "";
  addMessage("bot", "새 대화를 시작했어요. 무엇을 도와드릴까요?");
});

// ---- disease picker + medication panel + add-medication form ----

async function loadConditions() {
  const res = await fetch("/api/conditions");
  const data = await res.json();

  data.conditions.forEach(c => {
    conditionFilter.insertAdjacentHTML("beforeend", `<option value="${c}">${c}</option>`);
    medCondition.insertAdjacentHTML("beforeend", `<option value="${c}">${c}</option>`);
  });

  medTimesEl.innerHTML = data.time_slots.map(t =>
    `<label><input type="checkbox" name="time" value="${t}"> ${t}</label>`
  ).join("");
}

async function loadMedications() {
  const condition = conditionFilter.value;
  const url = condition ? `/api/medications?condition=${encodeURIComponent(condition)}` : "/api/medications";
  const res = await fetch(url);
  const data = await res.json();

  if (!res.ok || !data.items || data.items.length === 0) {
    medList.innerHTML = `<div class="empty-hint">해당 질환의 복용약이 없어요.</div>`;
    return;
  }

  medList.innerHTML = data.items.map(item => {
    const low = item.quantity <= 3;
    return `
      <div class="med-card">
        <div class="name"><span>${item.name}</span><span class="tag">${item.condition}</span></div>
        <div class="row"><span>${item.times.join("/")} · ${item.dose_per_time}정</span><span>${item.instructions}</span></div>
        <div class="row">
          <span class="${low ? "stock-low" : ""}">재고 ${item.quantity}개</span>
          <span>${item.duration_days}일치 · 정당 ${item.price.toLocaleString()}원</span>
        </div>
      </div>`;
  }).join("");
}

conditionFilter.addEventListener("change", loadMedications);

addMedForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  addMedMsg.textContent = "";
  addMedMsg.className = "";

  const times = Array.from(medTimesEl.querySelectorAll("input:checked")).map(el => el.value);
  if (times.length === 0) {
    addMedMsg.textContent = "복용 시간을 하나 이상 선택하세요.";
    addMedMsg.className = "error";
    return;
  }

  const payload = {
    name: document.getElementById("medName").value.trim(),
    condition: medCondition.value,
    dose_per_time: Number(document.getElementById("medDosePerTime").value),
    times,
    instructions: document.getElementById("medInstructions").value.trim(),
    duration_days: Number(document.getElementById("medDuration").value),
    price: Number(document.getElementById("medPrice").value),
    initial_stock: Number(document.getElementById("medStock").value || 0),
  };

  const res = await fetch("/api/medications", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const data = await res.json();

  if (!res.ok) {
    addMedMsg.textContent = data.error || "추가하지 못했어요.";
    addMedMsg.className = "error";
    return;
  }

  addMedMsg.textContent = `${data.name} 추가 완료 (재고 ${data.quantity}개)`;
  addMedMsg.className = "ok";
  addMedForm.reset();
  document.getElementById("medDosePerTime").value = 1;
  document.getElementById("medStock").value = 0;
  loadMedications();
});

loadConditions().then(loadMedications);
addMessage("bot", "안녕하세요! 부모님 약 복용 관리 어시스턴트입니다. 복용 기록, 재고, 다음 처방일을 도와드릴게요.");
</script>
</body>
</html>
