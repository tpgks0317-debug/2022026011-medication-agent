<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💊 약 복용 관리</title>
<style>
  :root {
    --bg: #f7f3ee;
    --panel: #ffffff;
    --accent: #6f4e37;
    --accent-light: #efe3d8;
    --text: #2b2320;
    --muted: #8a7a6d;
    --user-bubble: #6f4e37;
    --bot-bubble: #efe3d8;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 20px;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header button {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { background: rgba(255,255,255,0.28); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { display: flex; flex-direction: column; max-width: 80%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--bot-bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .msg.bot .bubble.error { background: #fbe9e7; color: var(--error); }

  .tools {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    max-width: 100%;
  }
  .tools summary { cursor: pointer; user-select: none; }
  .tool-call {
    font-family: "SF Mono", Consolas, monospace;
    background: #f2ece4;
    border-radius: 8px;
    padding: 6px 8px;
    margin-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .typing { color: var(--muted); font-size: 13px; padding-left: 4px; }

  form#chat-form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--accent-light);
    background: var(--panel);
  }
  #input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ddd0c2;
    font-size: 14px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>💊 약 복용 관리</h1>
      <button id="reset">New chat</button>
    </header>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="input" type="text" placeholder="복용 기록, 재고, 다음 처방일에 대해 물어보세요..." autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("chat-form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const resetBtn = document.getElementById("reset");

function addMessage(role, text, toolCalls, isError = false) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (isError ? " error" : "");
  bubble.textContent = text;
  wrap.appendChild(bubble);

  if (toolCalls && toolCalls.length) {
    const details = document.createElement("details");
    details.className = "tools";
    const summary = document.createElement("summary");
    summary.textContent = `🔧 ${toolCalls.length} tool call${toolCalls.length > 1 ? "s" : ""}`;
    details.appendChild(summary);
    toolCalls.forEach(tc => {
      const line = document.createElement("div");
      line.className = "tool-call";
      line.textContent = `${tc.name}(${tc.arguments}) → ${JSON.stringify(tc.result)}`;
      details.appendChild(line);
    });
    wrap.appendChild(details);
  }

  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function setLoading(isLoading) {
  sendBtn.disabled = isLoading;
  input.disabled = isLoading;
}

async function sendMessage(text) {
  addMessage("user", text);
  setLoading(true);

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "Agent is typing...";
  messagesEl.appendChild(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    typing.remove();
    if (!res.ok) {
      addMessage(
        "bot",
        "죄송해요, 요청을 처리하지 못했어요. 메시지를 다시 한번 확인하고 보내주시겠어요? 🙏",
        null,
        true
      );
    } else {
      addMessage("bot", data.reply || "죄송해요, 지금은 답을 드리지 못했어요. 다시 한번 물어봐 주시겠어요?", data.tool_calls);
    }
  } catch (err) {
    typing.remove();
    addMessage(
      "bot",
      "죄송합니다, 지금 서버와 연결이 원활하지 않네요. 잠시 후 다시 시도해 주시겠어요? 🙇",
      null,
      true
    );
  } finally {
    setLoading(false);
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendMessage(text);
});

resetBtn.addEventListener("click", async () => {
  await fetch("/api/reset", { method: "POST" });
  messagesEl.innerHTML = "";
  addMessage("bot", "새 대화를 시작했어요. 무엇을 도와드릴까요?");
});

addMessage("bot", "안녕하세요! 부모님 약 복용 관리 어시스턴트입니다. 복용 기록, 재고, 다음 처방일을 도와드릴게요.");
</script>
</body>
</html>
